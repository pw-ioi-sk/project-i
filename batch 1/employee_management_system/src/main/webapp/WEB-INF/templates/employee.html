<!DOCTYPE html>
<html lang="en" xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Employee</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: rgba(255, 255, 255, 0.08);
            --card-border: rgba(255, 255, 255, 0.12);
            --text: #e2e8f0;
            --muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --row-hover: rgba(56, 189, 248, 0.08);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #0f172a, #111827, #1e293b);
            color: var(--text);
            min-height: 100vh;
            padding: 40px 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5rem;
            letter-spacing: 1px;
            color: #ffffff;
            text-shadow: 0 4px 20px rgba(0,0,0,0.35);
        }

        a {
            text-decoration: none;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: var(--card);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(14px);
            border-radius: 18px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        .add-btn {
            display: inline-block;
            margin-bottom: 18px;
            padding: 10px 18px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--accent), #2563eb);
            color: white;
            font-weight: bold;
            transition: 0.3s ease;
        }

        .add-btn:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, var(--accent-hover), #1d4ed8);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            overflow: hidden;
            border-radius: 14px;
            background: rgba(15, 23, 42, 0.6);
        }

        thead {
            background: rgba(255, 255, 255, 0.08);
        }

        th, td {
            padding: 16px;
            text-align: left;
        }

        th {
            color: #cbd5e1;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        tbody tr {
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            transition: 0.25s ease;
        }

        tbody tr:hover {
            background: var(--row-hover);
            transform: scale(1.01);
        }

        td {
            color: var(--text);
        }

        .actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .delete-btn {
            border: none;
            padding: 9px 14px;
            border-radius: 8px;
            background: var(--danger);
            color: white;
            cursor: pointer;
            transition: 0.3s ease;
        }

        .delete-btn:hover {
            background: var(--danger-hover);
            transform: translateY(-1px);
        }

        .update-btn {
            padding: 9px 14px;
            border-radius: 8px;
            background: #22c55e;
            color: white;
            transition: 0.3s ease;
        }

        .update-btn:hover {
            background: #16a34a;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Employee List</h1>
    <a class="add-btn" th:href="@{/employee/add}">+ Add Employee</a>

    <table>
        <thead>
        <tr>
            <th>Id</th>
            <th>Name</th>
            <th>Dept</th>
            <th>Salary</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="employee : ${employees}">
            <td th:text="${employee.id}"></td>
            <td th:text="${employee.name}"></td>
            <td th:text="${employee.dept}"></td>
            <td th:text="${employee.salary}"></td>
            <td>
                <div class="actions">
                    <form method="post" th:action="@{/employee/delete}">
                        <input type="hidden" name="id" th:value="${employee.id}">
                        <button class="delete-btn" type="submit">Delete</button>
                    </form>
                    <a class="update-btn" th:href="@{/employee/update(id=${employee.id})}">Update</a>
                </div>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
