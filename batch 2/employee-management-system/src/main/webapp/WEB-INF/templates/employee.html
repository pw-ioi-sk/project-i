<!DOCTYPE html>
<html lang="en" xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Employee List</title>
    <style>
        :root {
            --bg: #f4f7fb;
            --card: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --line: #dbe3ee;
            --accent: #2563eb;
            --accent-dark: #1d4ed8;
            --danger: #dc3545;
            --danger-dark: #c82333;
            --cancel: #e5e7eb;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 32px;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #e8eef7 0%, #f8fafc 100%);
            color: var(--text);
        }

        h1 {
            margin: 0 0 18px;
            text-align: center;
            font-size: 2rem;
            letter-spacing: 0.3px;
        }

        .topbar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 16px;
        }

        .add-btn {
            display: inline-block;
            padding: 10px 16px;
            border-radius: 10px;
            background: var(--accent);
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            transition: 0.2s ease;
        }

        .add-btn:hover {
            background: var(--accent-dark);
            transform: translateY(-1px);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--card);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 18px 50px rgba(15, 23, 42, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.7);
        }

        th, td {
            padding: 14px 16px;
            text-align: left;
            border-bottom: 1px solid var(--line);
        }

        th {
            background: #eff6ff;
            color: #1e3a8a;
            font-weight: 700;
        }

        tr:hover td {
            background: #f8fbff;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        td:last-child {
            white-space: nowrap;
        }

        form {
            display: inline;
            margin: 0;
        }

        button,
        .update-btn {
            display: inline-block;
            padding: 9px 14px;
            border: none;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: 0.2s ease;
        }

        button {
            background: var(--danger);
            color: #fff;
        }

        button:hover {
            background: var(--danger-dark);
            transform: translateY(-1px);
        }

        .update-btn {
            margin-left: 8px;
            background: var(--cancel);
            color: var(--text);
        }

        .update-btn:hover {
            background: #d1d5db;
        }
    </style>
</head>
<body>
<h1>Employee List</h1>

<div class="topbar">
    <a class="add-btn" th:href="@{/employee/add}">Add Employee</a>
</div>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Branch</th>
        <th>Salary</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="employee : ${employees}">
        <td th:text="${employee.id}"></td>
        <td th:text="${employee.name}"></td>
        <td th:text="${employee.branch}"></td>
        <td th:text="${employee.salary}"></td>
        <td>
            <form th:action="@{/employee/delete}" method="post">
                <input type="hidden" name="id" th:value="${employee.id}">
                <button type="submit">Delete</button>
            </form>
            <a class="update-btn" th:href="@{/employee/update(id=${employee.id})}">Update</a>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
